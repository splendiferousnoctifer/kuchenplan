[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kuchenplan"
version = "0.1.0"
description = "Camp kitchen recipes, headcount, and shopping calculations"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.0"]

[project.scripts]
kuchenplan = "kuchenplan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kuchenplan*"]
